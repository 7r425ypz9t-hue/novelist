name: ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nis, POSTGRES_PASSWORD: nis, POSTGRES_DB: nis_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nis" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e ".[dev,postgres,pdf]" ruff
      - run: ruff check nis tests
      - name: tests
        env:
          CI: "true"
          NIS_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://nis:nis@127.0.0.1:5432/nis_test' || '' }}
        run: |
          if [ -z "$NIS_DATABASE_URL" ]; then unset NIS_DATABASE_URL; fi
          python -m pytest -q
      - name: security lint (bandit rules via ruff S)
        run: ruff check --select S nis

  windows:
    # The writer's own machine: backend tests on Windows, then the double-click launcher end to end
    # (Windows PowerShell 5.1, the one Kateb.cmd uses): install, build, key, doctor, account, novel, exports.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: backend tests on Windows
        working-directory: apps/api
        env: { CI: "true" }
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - name: launcher smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\start.ps1 -SmokeTest -Port 8765
      - name: desktop and Start-menu icons
        shell: powershell
        run: |
          .\scripts\start.ps1 -CreateShortcut
          # read back with Shell.Application (Unicode-safe; WScript.Shell cannot open Arabic file names)
          $app = New-Object -ComObject Shell.Application
          foreach ($f in @([Environment]::GetFolderPath("Desktop"), [Environment]::GetFolderPath("Programs"))) {
            $links = @($app.Namespace($f).Items() | Where-Object { $_.IsLink -and $_.GetLink.Path -like "*\Kateb.cmd" })
            if (-not $links) { throw "no Kateb shortcut in $f" }
            $l = $links[0]
            if ($l.Path -match '\?' -or $l.Name -like 'kateb-*' -or $l.Path -notmatch '[^\x00-\x7F]') { throw "shortcut name not Arabic: $($l.Path)" }
            if (@(Get-ChildItem $f -Filter 'kateb-*.lnk').Count) { throw "temporary shortcut left in $f" }
            # ask Windows for the icon exactly as Explorer will (Shell link API)
            $iconPath = ""
            [void]$l.GetLink.GetIconLocation([ref]$iconPath)
            Write-Host "icon of $($l.Path): '$iconPath'"
            if ($iconPath -notlike '*kateb.ico') { throw "icon not set on $($l.Path)" }
            if (-not (Test-Path "infra\windows\kateb.ico")) { throw "icon file missing" }
            Write-Host "OK $($l.Path) -> $($l.GetLink.Path) (working dir $($l.GetLink.WorkingDirectory))"
          }

      - name: icons appear on the writer's real path (normal start, and start while already running)
        shell: powershell
        run: |
          $app = New-Object -ComObject Shell.Application
          $folders = @([Environment]::GetFolderPath("Desktop"), [Environment]::GetFolderPath("Programs"))
          function Kateb-Links { foreach ($f in $folders) { $app.Namespace($f).Items() | Where-Object { $_.IsLink -and $_.GetLink.Path -like "*\Kateb*.cmd" } } }
          function Reset-Icons { Kateb-Links | ForEach-Object { Remove-Item -LiteralPath $_.Path -Force }; Remove-Item "$env:LOCALAPPDATA\Kateb\shortcuts.txt" -ErrorAction SilentlyContinue }
          function Assert-Icons([string]$when) {
            foreach ($f in $folders) {
              $l = @($app.Namespace($f).Items() | Where-Object { $_.IsLink -and $_.GetLink.Path -like "*\Kateb.cmd" })
              if (-not $l) { throw "[$when] no Kateb icon in $f" }
              Write-Host "[$when] OK $($l[0].Path)"
            }
          }
          # 1) the normal double-click path: Kateb.cmd starts the app and leaves it running
          Reset-Icons
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "Kateb.cmd -NoBrowser -Port 8766" -PassThru -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 180 -and -not $up; $i++) { try { Invoke-RestMethod "http://127.0.0.1:8766/v1/health" -TimeoutSec 2 | Out-Null; $up = $true } catch { Start-Sleep 1 } }
          if (-not $up) { throw "Kateb.cmd did not start the app" }
          Assert-Icons "normal start"
          # 2) icons removed while the app is running: a second Kateb.cmd must restore them and exit
          Reset-Icons
          cmd.exe /c "Kateb.cmd -NoBrowser -Port 8766"
          if ($LASTEXITCODE -ne 0) { throw "second start failed ($LASTEXITCODE)" }
          Assert-Icons "already running"
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*nis.cli serve*8766*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, msedge]   # NFR06: RTL across Chrome, Firefox and Edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e "apps/api[dev,pdf]"
      - working-directory: apps/web
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
          npx vite build
          NIS_PYTHON=python npx playwright test
