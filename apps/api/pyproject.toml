[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nis-api"
version = "0.1.0"
description = "Novel Intelligence Studio — FastAPI backend (Arabic-first novel writing studio)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "python-docx>=1.1",
  "pypdf>=4.2",
  "reportlab>=4.2",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.4.2",
  "httpx>=0.27",
  "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
nis = "nis.cli:main"

[tool.setuptools.packages.find]
include = ["nis*"]

[tool.setuptools.package-data]
"nis" = ["assets/fonts/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]
ignore = ["E501", "S101", "B008", "S311"]
